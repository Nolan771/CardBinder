name: Build CardBinder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Décompresser CardBinder
        run: |
          unzip -o CardBinder.zip -d extracted
          cp -r extracted/CardBinder/* .
          cp -r extracted/CardBinder/.[!.]* . 2>/dev/null || true

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'application
        run: gradle assembleDebug

      - name: Préparer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CardBinder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
